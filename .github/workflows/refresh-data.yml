name: Extract financial observations for review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m scripts.refresh_data --require-success
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: financial-observations-for-review
          path: data/ingestion/
